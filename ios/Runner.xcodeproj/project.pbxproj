			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "#!/bin/bash\nset -e\n# Only patch for device builds — simulator builds need IOSSIMULATOR platform markers\nif [[ \"$PLATFORM_NAME\" == *\"simulator\"* ]]; then\n  echo \"Simulator build — skipping platform patch\"\n  exit 0\nfi\nAPP=\"${TARGET_BUILD_DIR}/${WRAPPER_NAME}\"\nSDK=$(xcrun --sdk iphoneos --show-sdk-version)\nfind \"$APP\" -name '*.framework' -type d | while read -r FW; do\n  EXEC=$(defaults read \"$FW/Info.plist\" CFBundleExecutable 2>/dev/null || true)\n  [ -z \"$EXEC\" ] && continue\n  BIN=\"$FW/$EXEC\"\n  [ -f \"$BIN\" ] || continue\n  # Strip x86_64 (simulator-only arch) from device builds\n  if lipo -archs \"$BIN\" 2>/dev/null | grep -q \"x86_64\"; then\n    echo \"Stripping x86_64 from $EXEC\"\n    lipo -remove x86_64 \"$BIN\" -output \"${BIN}.stripped\" && mv \"${BIN}.stripped\" \"$BIN\"\n  fi\n  # Patch IOSSIMULATOR platform markers to IOS for device builds\n  if vtool -show-build \"$BIN\" 2>/dev/null | grep -q \"IOSSIMULATOR\"; then\n    MIN_OS=$(defaults read \"$FW/Info.plist\" MinimumOSVersion 2>/dev/null || echo \"${IPHONEOS_DEPLOYMENT_TARGET:-15.0}\")\n    echo \"Patching $EXEC: IOSSIMULATOR -> IOS (minos=$MIN_OS)\"\n    vtool -set-build-version ios \"$MIN_OS\" \"$SDK\" -replace -output \"${BIN}.fixed\" \"$BIN\"\n    mv \"${BIN}.fixed\" \"$BIN\"\n  fi\ndone\n";
		};
